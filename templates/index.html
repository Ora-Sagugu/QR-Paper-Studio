<!--
  index.html — 页面骨架，由 app.py 的 home() 渲染
  id 与 static/js/main.js 中的 getElementById 一一对应
-->
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Paper Studio · 纸上码工坊</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <header class="app-header no-print">
        <h1>QR Paper Studio</h1>
        <p class="subtitle">在一张 A4 上排版多个二维码</p>
    </header>

    <section class="control-panel no-print">
        <label class="field-label" for="qrText">要添加的二维码内容</label>
        <textarea
            id="qrText"
            rows="3"
            maxlength="500"
            autofocus
            placeholder="例如：https://example.com 或 任意文字、数字"></textarea>
        <p id="charCount" class="field-hint">已输入 0 / 500 字</p>

        <div class="toolbar">
            <button id="addBtn" type="button" class="btn btn-primary">添加并生成</button>
            <button id="deleteBtn" type="button" class="btn btn-secondary" disabled>删除选中</button>
            <button id="downloadBtn" type="button" class="btn btn-secondary" disabled>下载 A4 PNG</button>
            <button id="printBtn" type="button" class="btn btn-secondary" disabled>打印 A4</button>
        </div>
        <p class="field-hint">提示：Ctrl + Enter 快速添加 · 单页最多 12 个二维码</p>
        <p id="message" class="message" role="status"></p>
    </section>

    <section class="qr-manager no-print">
        <h2 class="section-title">已添加的二维码</h2>
        <ul id="qrList" class="qr-list" aria-label="二维码列表"></ul>
        <p id="qrListEmpty" class="field-hint">暂无二维码，请在上方输入内容后点击「添加并生成」。</p>
    </section>

    <section class="preview-section">
        <h2 class="section-title no-print">A4 预览</h2>
        <p class="field-hint no-print preview-hint">点击选中；拖动可改位置，或用下方 X/Y、大小微调</p>
        <div class="a4-paper" id="a4Paper" aria-label="A4 排版预览"></div>
    </section>

    <section id="layoutControls" class="layout-controls no-print is-disabled" aria-disabled="true">
        <h2 class="section-title">当前选中二维码</h2>
        <label class="control-row">
            <span>大小</span>
            <input id="qrSize" type="range" min="40" max="280" value="120" disabled>
            <span id="qrSizeValue" class="control-value">120 px</span>
        </label>
        <label class="control-row">
            <span>左边距 X</span>
            <input id="qrX" type="number" min="0" max="555" value="40" disabled>
        </label>
        <label class="control-row">
            <span>上边距 Y</span>
            <input id="qrY" type="number" min="0" max="802" value="40" disabled>
        </label>
    </section>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
